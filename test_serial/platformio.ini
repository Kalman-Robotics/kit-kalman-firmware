; Prueba aislada del transporte serial de micro-ROS.
;
; Proyecto aparte a proposito: no arrastra motores, LiDAR, IMU ni SPIFFS, asi
; que si publica, el transporte esta bien y lo que falle en el firmware
; completo esta en el firmware, no en el enlace.
;
;   pio run -t upload
;   ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/ttyUSB0 -b 921600

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM8
monitor_port = COM8
; El transporte abre el UART a 921600; el agente debe usar el mismo -b
monitor_speed = 921600

; Se reusa la libreria del proyecto principal en vez de duplicarla: asi la
; prueba corre exactamente contra el mismo libmicroros.a que el firmware.
lib_extra_dirs = ../lib
build_flags =
    -L../lib/micro_ros_kalman/src
    -lmicroros
