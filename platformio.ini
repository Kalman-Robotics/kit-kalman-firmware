; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Auto-detección del puerto ESP32
; Si quieres usar un puerto fijo, comenta la línea extra_scripts y descomenta upload_port/monitor_port
#extra_scripts = pre:detect_port.py
#upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
upload_port = COM3
monitor_speed = 115200 
#monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
monitor_port = COM3
lib_deps = 
    ; All libraries in lib/ are automatically detected
	adafruit/Adafruit NeoPixel@^1.15.2
build_flags =
    -Llib/micro_ros_kalman/src
    -lmicroros
board_build.filesystem = spiffs

; ---------------------------------------------------------------------------
; Firmware de diagnostico: prueba de estabilidad del WiFi.
; Solo se asocia al AP y reporta estadisticas por UDP. Sin lidar, motores ni
; micro-ROS, para aislar la red como unica variable.
;   pio run -e wifi-test -t upload
; ---------------------------------------------------------------------------
[env:wifi-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Sin upload_port/monitor_port: PlatformIO autodetecta el puerto del ESP32.
; Descomentar y fijar solo si hay mas de un dispositivo conectado.
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_src_filter = -<*> +<../test_wifi/>
board_build.filesystem = spiffs

; ---------------------------------------------------------------------------
; Firmware completo en modo diagnostico: NO reinicia ante ningun fallo, cuenta
; los eventos y los reporta por UDP 8891. Para pruebas de larga duracion, en
; particular validar el fix del desborde de 71.58 min.
;   pio run -e esp32-s3-diag -t upload
; ---------------------------------------------------------------------------
[env:esp32-s3-diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Fijo el puerto: la autodeteccion puede elegir un COM de Bluetooth
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit NeoPixel@^1.15.2
build_flags =
    -Llib/micro_ros_kalman/src
    -lmicroros
    -DDIAG_NO_RESTART=1
board_build.filesystem = spiffs
; La tabla default_8MB ya reserva una particion coredump de 64K en 0x7F0000.
; Con el volcado a flash, tras un cuelgue se puede leer por USB cuando convenga
; (idf.py coredump-info) sin tener que vigilar el puerto serie en el momento.
board_build.partitions = default_8MB.csv

; ---------------------------------------------------------------------------
; Prueba aislada de micro-ROS: solo suscriptor de cmd_vel, sin lidar, motores,
; IMU ni telemetria. Sirve para separar si un fallo del enlace viene de
; micro-ROS/red o del codigo de la aplicacion.
;   pio run -e microros-test -t upload
; ---------------------------------------------------------------------------
[env:microros-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_src_filter = -<*> +<../test_microros/>
build_flags =
    -Llib/micro_ros_kalman/src
    -lmicroros
board_build.filesystem = spiffs

; ---------------------------------------------------------------------------
; Carga por WiFi del firmware de diagnostico. La tabla default_8MB ya reserva
; dos particiones de aplicacion de 3.34 MB y la imagen ocupa 1.18 MB, asi que
; no hace falta reorganizar el flash: OTA escribe en la inactiva y, si la carga
; se corta, el bootloader sigue arrancando la anterior.
;   pio run -e esp32-s3-diag-ota -t upload
; ---------------------------------------------------------------------------
[env:esp32-s3-diag-ota]
extends = env:esp32-s3-diag
upload_protocol = espota
upload_port = 192.168.4.48
upload_flags =
    --auth=kalman2024
    --port=3232
