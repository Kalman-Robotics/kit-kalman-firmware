; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Auto-detección del puerto ESP32
; Si quieres usar un puerto fijo, comenta la línea extra_scripts y descomenta upload_port/monitor_port
#extra_scripts = pre:detect_port.py
#upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
upload_port = COM8
; El transporte micro-ROS abre el UART a 921600: el agente debe arrancar con
; -b 921600. El monitor solo sirve en el build de depuracion (env :debug).
monitor_speed = 921600
#monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
monitor_port = COM8
lib_deps = 
    ; All libraries in lib/ are automatically detected
	adafruit/Adafruit NeoPixel@^1.15.2
build_flags =
    -Llib/micro_ros_kalman/src
    -lmicroros
board_build.filesystem = spiffs


; Build de depuracion: reactiva los DEBUG_PRINT por el UART.
; NO usar con el agente micro-ROS conectado --los logs se intercalan con las
; tramas XRCE-DDS y corrompen la sesion--. Sirve para probar motores, LiDAR o
; IMU contra el monitor serie.
[env:esp32-s3-debug]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DKALMAN_DEBUG_SERIAL
