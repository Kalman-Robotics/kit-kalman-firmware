; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Version fijada a proposito. La 6.12.0 trae el core Arduino 2.0.17; el core
; 3.1.0 tiene un fallo abierto de cuelgues y perdida de datos en USB-CDC
; (espressif/arduino-esp32#10836) que afectaria al transporte serial.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Auto-detección del puerto ESP32
; Si quieres usar un puerto fijo, comenta la línea extra_scripts y descomenta upload_port/monitor_port
#extra_scripts = pre:detect_port.py
#upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
upload_port = COM8
; La placa expone DOS puertos serie USB independientes, uno por conector:
;   conector UART (chip CH343)  -> COM8 -> carga de firmware y micro-ROS @921600
;   conector USB  (nativo S3)   -> COM9 -> monitor de depuracion
; Por eso se puede depurar con el agente conectado: van por caminos distintos.
;
; El baudrate del monitor es indiferente en el USB nativo --no hay reloj fisico
; que acordar--. El que si importa es el del agente: -b 921600.
;
; Abrir COM8 reinicia la placa (el CH343 usa DTR/RTS); COM9 no, asi que el
; monitor se puede conectar y desconectar sin cortar la sesion micro-ROS.
monitor_speed = 115200
#monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AF7090481-if00
monitor_port = COM9
lib_deps = 
    ; All libraries in lib/ are automatically detected
	adafruit/Adafruit NeoPixel@^1.15.2
build_flags =
    -Llib/micro_ros_kalman/src
    -lmicroros
board_build.filesystem = spiffs


; Build de depuracion: reactiva los DEBUG_PRINT.
; Ver include/debug_log.h para por que puerto salen.
[env:esp32-s3-debug]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DKALMAN_DEBUG_SERIAL